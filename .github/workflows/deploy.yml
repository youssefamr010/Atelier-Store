name: 🚀 Auto Deploy to atelier404.store

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy & Clear Cache
    runs-on: ubuntu-latest

    steps:
      - name: 🔔 Trigger Deploy Hook on Server
        run: |
          echo "Triggering deploy hook on atelier404.store..."
          RESPONSE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
            "https://atelier404.store/_deploy.php?token=${{ secrets.DEPLOY_TOKEN }}" \
            --max-time 60)

          echo "HTTP Status: $RESPONSE"
          echo "Server Response:"
          cat /tmp/deploy_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Deploy hook returned HTTP $RESPONSE"
            exit 1
          fi

          STATUS=$(cat /tmp/deploy_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          echo "Deploy status: $STATUS"

          if [ "$STATUS" != "success" ]; then
            echo "❌ Deploy reported an error"
            exit 1
          fi

          echo "✅ Deploy completed successfully!"
