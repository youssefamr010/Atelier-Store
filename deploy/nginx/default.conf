server {
    listen 80;
    server_name atelier404.store www.atelier404.store _;
    root /var/www/html/public;
    index index.php;
    # Matches the 50 MB media API allowance, with room for multipart overhead.
    client_max_body_size 52m;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Directly serve persistent uploads and media; ^~ prevents regex override
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        root /var/www/html/public;
        try_files $uri /../storage/app/public$uri =404;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
